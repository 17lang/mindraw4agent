name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run check
      - run: npm run test:frame
      - run: npm run test:write
      - run: npm run smoke
      - run: npm run smoke:http
      - run: npm run smoke:lifecycle
      - run: npm run smoke:mcp
      - run: node scripts/doctor.mjs --json
